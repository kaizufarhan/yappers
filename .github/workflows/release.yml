# Builds the Windows installer and publishes it as a GitHub Release whenever a
# version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Bump "version" in src-tauri/tauri.conf.json (and package.json /
# src-tauri/Cargo.toml) to match the tag first.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed copies accept it (see updater.rs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Yappers ${{ github.ref_name }}
          releaseBody: |
            **Download:** `Yappers_x64-setup.exe` below.

            Windows may show "Windows protected your PC" because the app isn't code-signed yet: click **More info → Run anyway**. On first launch Yappers downloads its speech model (about 640 MB, one time).
          releaseDraft: false
          prerelease: false

      # A copy with a fixed name, so one link always gets the newest version:
      # https://github.com/<owner>/<repo>/releases/latest/download/Yappers_x64-setup.exe
      - name: Upload stable-named installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1)
          cp "$installer" Yappers_x64-setup.exe
          gh release upload "${{ github.ref_name }}" Yappers_x64-setup.exe --clobber
