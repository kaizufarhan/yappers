[package]
name = "yappers"
version = "0.1.0"
description = "Free, private, local voice dictation"
authors = ["Farhan Ahmed"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "yappers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3", features = ["onnx"] }
cpal = "0.18"
arboard = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Graphics_Dwm",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
